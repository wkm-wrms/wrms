<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WKM Racing Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <div class="timer-block" <div class="element">
            <span id="timer-message">Czas do końca</span>:<span id="timer">00:10</span>
        </div>

        <div class="message-block">
            <span id="message">Koniec czasu, zmiana grupy!</span>
        </div>

        <div class="pilot-block">
            <span class="pilot-item">
                <span class="pilot-name" id="pilot1name">Pilot1 </span>
                <span class="pilot-channel" id="pilot1channel">R1</span>
            </span>
            <span class="pilot-item">
                <span class="pilot-name" id="pilot2name">Pilot2 </span>
                <span class="pilot-channel" id="pilot2channel">R3</span>
            </span>
            <span class="pilot-item">
                <span class="pilot-name" id="pilot3name">Pilot3 </span>
                <span class="pilot-channel" id="pilot3channel">R6</span>
            </span>
            <span class="pilot-item">
                <span class="pilot-name" id="pilot4name">Pilot4 </span>
                <span class="pilot-channel" id="pilot4channel">R7</span>
            </span>
        </div>


        <div class="next-pilot-block">
            <div class="next-pilot-message">
                <span id="nextpilotmessage">Następna grupa</span>
            </div>
            <div class="next-pilot-item">
                <span class="next-pilot-name" id="nextpilot1name">Next Pilot1 </span>
                <span class="next-pilot-channel" id="nextpilot1channel">R1</span>
            </div>
            <div class="next-pilot-item">
                <span class="next-pilot-name" id="nextpilot2name">Next Pilot3 </span>
                <span class="next-pilot-channel" id="nextpilot2channel">R2</span>
            </div>
            <div class="next-pilot-item">
                <span class="next-pilot-name" id="nextpilot3name">Next Pilot4 </span>
                <span class="next-pilot-channel" id="nextpilot3channel">R6</span>
            </div>
            <div class="next-pilot-item">
                <span class="next-pilot-name" id="nextpilot4name">Next Pilot4 </span>
                <span class="next-pilot-channel" id="nextpilot4channel">R7</span>
            </div>
        </div>


        <div class="menu-block">
            <button class="menu-button" id="groups-button">Grupy</button>
            <button class="menu-button" id="pilot-button">Pilot</button>
            <button class="menu-button" id="master-button">Master</button>
        </div>
    </div>
</body>

</html>
