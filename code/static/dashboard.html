<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPV Race Dashboard</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-gray: #202020;
            --card-bg: #505050;
            --next-card-bg: #161616;
            --text-main: #eeeeee;
            --accent: #00d4ff;
            --warning: #ffcc00;
            --danger: #ff4d4d;
            --success: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        #logo {
            height: 50px;
            width: 200px;
            margin: 0px;
            padding: 0px;
            margin-bottom: -10px;
            padding: 10px;
            display: flex;
            position: absolute;
            top: 0%;
            align-items: left;
        }

        /* --- TIMER & STATUS --- */
        .top-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: absolute;
            top: 0%;

            height: 15%;
            width: 100%;
        }

        #flight-number {
            font-size: clamp(2rem, 3vw, 4rem);
            ;
            letter-spacing: 8px;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        #status-label {
            font-size: clamp(2rem, 4vw, 4rem);
            text-transform: uppercase;
            letter-spacing: 8px;
            color: var(--accent);
            margin-bottom: 0px;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        #timer {
            font-size: clamp(8rem, 15vw, 14rem);
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;

            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: absolute;
            top: 15%;
            height: 35%;
            width: 100%;
        }


        .timer-low {
            color: var(--danger);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        /* --- CURRENT PILOTS GRID --- */
        .pilot-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 20px 20px 20px;
            position: absolute;
            top: 50%;
            align-self: center;
            height: 20%;
            width: 95%;
            z-index: 100;
        }

        .pilot-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 2px solid #222;
            transition: all 0.3s ease;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .pilot-card.active {
            border-color: var(--accent);
            box-shadow: inset 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .channel-label {
            font-size: clamp(1rem, 3vw, 2rem);
            color: #666;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .pilot-name {
            font-size: clamp(1rem, 3vw, 2rem);
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vtx-info {
            font-size: clamp(0.5rem, 1.vw, 1rem);
            color: var(--accent);
            opacity: 0.8;
            margin-top: 5px;
        }

        .empty-slot {
            color: #333;
            font-style: italic;
            font-size: 1.5rem;
        }


        /* --- NEXT PILOTS GRID --- */
        .next-pilots-container {
            display: flex;
            flex-direction: column;

            font-size: 1.3rem;
            overflow: hidden;
            position: absolute;
            top: 75%;
            height: 15%;
            left: 0%;
            width: 100%;
            border: #fff;
        }

        .next-label {
            font-weight: bold;
            color: var(--warning);
            margin-right: 25px;
            font-size: 1.1rem;
            align-self: center;
        }

        .next-pilot-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            padding: 0;
            width: 95%;
            align-self: center;
            flex-wrap: nowrap;
        }

        .next-pilot-card {
            background: var(--next-card-bg);
            border-radius: 12px;
            padding: 0px;
            text-align: center;
            border: 2px solid #222;
            transition: all 0.3s ease;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .next-channel-label {
            font-size: clamp(1rem, 2vw, 1rem);
            color: #666;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .next-pilot-name {
            font-size: clamp(1rem, 2vw, 1.5rem);
            ;
            font-weight: bold;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .next-vtx-info {
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            color: #888;
            opacity: 0.8;
            visibility: hidden;
            display: none;
        }

        .next-empty-slot {
            color: #333;
            font-style: italic;
            font-size: 1vw;
        }


        /* --- FOOTER --- */
        .footer {
            padding: 10px;
            display: flex;
            gap: 15px;
            justify-content: center;
            background: #000;
            position: absolute;
            top: 92%;
            left: 0%;
            width: 100%;
            height: 5%;
        }

        .btn {
            padding: 12px 35px;
            border: none;
            border-radius: 6px;
            font-size: clamp(1rem, 2vw, 1.1rem);
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-secondary {
            background: #333;
            color: #ccc;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 40%;
            width: 100%;
            height: 50%;
            background: rgba(0, 0, 0, 0.95);
            opacity: 95%;
        }

        .modal-content {
            background: var(--card-bg);
            margin: 2% auto;
            padding: 25px;
            width: 85%;
            height: 85%;
            border-radius: 15px;
            position: relative;
            border: 1px solid #333;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 3rem;
            cursor: pointer;
            color: #666;
        }

        /* --- STARTUP AUDIO MODAL --- */
        #startupModal {
            display: flex;
            position: fixed;
            z-index: 2000;
            inset: 0;
            background: rgba(0, 0, 0, 0.97);
            align-items: center;
            justify-content: center;
        }

        #startupModal .startup-box {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 50px 60px;
            text-align: center;
            border: 1px solid #333;
            max-width: 520px;
            width: 90%;
        }

        #startupModal h2 {
            color: var(--accent);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        #startupModal p {
            color: #aaa;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        #startupModal .startup-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #startupModal .btn-audio-yes {
            background: var(--accent);
            color: #000;
            font-size: 1.1rem;
            padding: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #startupModal .btn-audio-no {
            background: #333;
            color: #aaa;
            font-size: 0.95rem;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #startupModal .btn-audio-yes:hover { filter: brightness(110%); }
        #startupModal .btn-audio-no:hover  { background: #444; }
    </style>
</head>

<body>
    <!-- Audio elements -->
    <audio id="startSound" preload="auto">
        <source src="/static/sounds/start.mp3" type="audio/mpeg">
    </audio>
    <audio id="endSound" preload="auto">
        <source src="/static/sounds/end.mp3" type="audio/mpeg">
    </audio>
    <!-- Silent audio used solely to unlock the browser autoplay policy -->
    <audio id="silentSound" preload="auto">
        <source src="/static/sounds/silent.mp3" type="audio/mpeg">
    </audio>

    <!-- Startup modal — must be dismissed before dashboard activates -->
    <div id="startupModal">
        <div class="startup-box">
            <h2>WKM Race</h2>
            <p>Wybierz tryb dźwięku dla tej sesji</p>
            <div class="startup-buttons">
                <button class="btn-audio-yes" onclick="startDashboard(true)">
                    🔊 Z komunikatami dźwiękowymi
                </button>
                <button class="btn-audio-no" onclick="startDashboard(false)">
                    Bez dźwięku
                </button>
            </div>
        </div>
    </div>

    <div id="logo"><img src="/static/logo.png" alt="Logo" /></div>
    <div class="top-section">
        <div id="flight-number"></div>
        <div id="status-label">ŁADOWANIE...</div>
    </div>
    <div id="timer">00:00</div>
    <div class="pilot-grid">
        <div class="pilot-card" id="slot-R1">
            <div class="channel-label">R1</div>
            <div class="pilot-content"></div>
        </div>
        <div class="pilot-card" id="slot-R3">
            <div class="channel-label">R3</div>
            <div class="pilot-content"></div>
        </div>
        <div class="pilot-card" id="slot-R6">
            <div class="channel-label">R6</div>
            <div class="pilot-content"></div>
        </div>
        <div class="pilot-card" id="slot-R7">
            <div class="channel-label">R7</div>
            <div class="pilot-content"></div>
        </div>
    </div>

    <div class="next-pilots-container">

        <div class="next-label">NASTĘPNA GRUPA:</div>
        <div class="next-pilot-grid">

            <div class="next-pilot-card" id="next-slot-R1">
                <div class="next-channel-label">R1</div>
                <div class="next-pilot-content"></div>
            </div>
            <div class="next-pilot-card" id="next-slot-R3">
                <div class="next-channel-label">R3</div>
                <div class="next-pilot-content"></div>
            </div>
            <div class="next-pilot-card" id="next-slot-R6">
                <div class="next-channel-label">R6</div>
                <div class="next-pilot-content"></div>
            </div>
            <div class="next-pilot-card" id="next-slot-R7">
                <div class="next-channel-label">R7</div>
                <div class="next-pilot-content"></div>
            </div>
        </div>
    </div>
    <div class="footer">
        <button class="btn btn-secondary" onclick="openModal('groupsModal')">Lista Grup</button>
        <button style="display:none;" class="btn btn-primary" onclick="openModal('pilotModal')">Panel
            Pilota</button>
    </div>


    <div id="groupsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('groupsModal')">&times;</span>
            <iframe id="groups-frame" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <div id="pilotModal" class="modal">
        <div class="modal-content" style="text-align:center; height: auto; margin-top: 10%;">
            <span class="close" onclick="closeModal('pilotModal')">&times;</span>
            <h2 style="font-size: 2rem; color: var(--accent);">Panel Pilota</h2>
            <div style="display:grid; gap:20px; padding: 40px;">
                <button class="btn btn-secondary" style="padding: 25px;" onclick="pilotAction('stop')">ZAKOŃCZ
                    LATANIE</button>
                <button class="btn btn-secondary" style="padding: 25px;" onclick="pilotAction('break')">PRZERWA
                    (DNP)</button>
                <button class="btn btn-primary" style="padding: 25px;" onclick="pilotAction('return')">POWRÓT DO
                    KOLEJKI</button>
            </div>
        </div>
    </div>

    <script>
        const CHANNELS = ["R1", "R3", "R6", "R7"];

        let audioEnabled = false;

        function startDashboard(withAudio) {
            audioEnabled = withAudio;

            if (withAudio) {
                // Play silent sound to unlock browser autoplay policy with this user gesture
                const silent = document.getElementById('silentSound');
                if (silent) silent.play().catch(() => {});
            }

            document.getElementById('startupModal').style.display = 'none';

            // Begin polling now that user has interacted
            setInterval(updateDashboard, 5000);
            setInterval(displayTimer, 100);
            updateDashboard();
            displayTimer();
        }

        async function updateDashboard() {
            try {
                // 1. Pobierz Aktualny Heat
                const resCurr = await fetch('/api/heat');
                const response = await resCurr.json();
                rendertHeats(response);
                displayTimer();

            } catch (e) {
                console.error("Dashboard Sync Error:", e);
            }
        }

        let currenHeatNumber = null;
        let currentHeatStatus = null;
        let currentTimerEnds = null
        let timerRunning = false;


        function displayTimer() {
            if (!timerRunning)
                return;
            const timerEl = document.getElementById('timer');

            if (currentTimerEnds) {
                let secs = (currentTimerEnds - Date.now()) / 1000
                if (secs <= 0) {
                    updateDashboard();
                    secs = (currentTimerEnds - Date.now()) / 1000
                }
                timerEl.innerText = formatTime(secs);
                // Alert wizualny poniżej 30s
                if (secs < 30 && currentHeatStatus === 'FLIGHT') {
                    timerEl.classList.add('timer-low');
                } else {
                    timerEl.classList.remove('timer-low');
                }

            } else {
                timerEl.innerText = "READY";
                timerEl.classList.remove('timer-low');
            }
            return;
        }

        function rendertHeats(response) {
            const timerEl = document.getElementById('timer');
            const statusEl = document.getElementById('status-label');

            if (response.status !== "ok" || !response.heat) {
                statusEl.innerText = response.message || "SESJA WSTRZYMANA";
                timerEl.innerText = "PAUZA";
                timerEl.classList.remove('timer-low');
                timerRunning = false;
                clearCurrentGrid();
                clearNextGrid();
                return;
            }
            const statusPublic = {
                "FLIGHT": "W trakcie lotów",
                "PREP": "Przygotowanie",
                "PAUSED": "Pauza",
            }

            const heat = response.heat;

            if (currenHeatNumber !== heat.heat_number) {
                currenHeatNumber = heat.heat_number;
                document.getElementById('flight-number').innerText = `Bieg numer: ${heat.heat_number}`;
            }

            if (currentHeatStatus !== heat.status) {
                if ((heat.status === 'FLIGHT') || (heat.status === 'PREP')) {
                    timerRunning = true;
                } else if (heat.status === 'PAUSED') {
                    timerRunning = false;
                }
                if (heat.status === 'FLIGHT') {
                    playStartSound();
                } else if (heat.status === 'PREP') {
                    playEndSound();
                }
                currentHeatStatus = heat.status;
                document.getElementById('status-label').innerText = statusPublic[heat.status];
            }

            // Timer Logic
            if (heat.live_seconds_left !== null) {
                const secs = heat.live_seconds_left;
                if (heat.status === 'PAUSED') {
                    // Timer is frozen — update display once directly, don't rely on displayTimer()
                    timerEl.innerText = formatTime(secs);
                    currentTimerEnds = null;
                    if (secs < 30) {
                        timerEl.classList.add('timer-low');
                    } else {
                        timerEl.classList.remove('timer-low');
                    }
                } else {
                    currentTimerEnds = Date.now() + secs * 1000;
                }
            }
            // Current pilots Grid Logic
            CHANNELS.forEach(ch => {
                const slot = document.getElementById(`slot-${ch}`);
                const pilot = heat.channels[ch];
                const content = slot.querySelector('.pilot-content');
                if (pilot) {
                    slot.classList.add('active');
                    content.innerHTML = `
                    <div class="pilot-name">${pilot.pilot.name}</div>
                    <div class="vtx-info">${pilot.vtx}</div>
                `;
                } else {
                    slot.classList.remove('active');
                    content.innerHTML = `<div class="empty-slot">---</div>`;
                }
            });

            const next_heat = response.next_heat;

            if (!next_heat || !next_heat.channels) {
                clearNextGrid();
                return;
            }


            // Current pilots Grid Logic
            CHANNELS.forEach(ch => {
                const slot = document.getElementById(`next-slot-${ch}`);
                const pilot = next_heat.channels[ch];
                const content = slot.querySelector('.next-pilot-content');
                if (pilot) {
                    content.innerHTML = `
                    <div class="next-pilot-name">${pilot.pilot.name}</div>
                    <div class="next-vtx-info">${pilot.vtx}</div>
                `;
                } else {
                    slot.classList.remove('active');
                    content.innerHTML = `<div class="empty-slot">---</div>`;
                }
            });
            return;
        }

        function clearCurrentGrid() {
            CHANNELS.forEach(ch => {
                const slot = document.getElementById(`slot-${ch}`);
                slot.classList.remove('active');
                slot.querySelector('.pilot-content').innerHTML = `<div class="empty-slot">---</div>`;
            });
        }
        function clearNextGrid() {
            CHANNELS.forEach(ch => {
                const slot = document.getElementById(`next-slot-${ch}`);
                slot.querySelector('.next-pilot-content').innerHTML = `<div class="next-empty-slot">---</div>`;
            });
        }

        function formatTime(seconds) {
            if (seconds <= 0) {
                return "00:00";
            }
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60)
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        let modalTimer = null; // Zmienna do przechowywania referencji licznika

        // --- GŁÓWNA OBSŁUGA KLAWIATURY ---
        window.addEventListener('keydown', function (event) {
            if (event.key === "Escape") {
                // Sprawdzamy, który modal jest otwarty i go zamykamy
                const groupsModal = document.getElementById('groupsModal');
                const pilotModal = document.getElementById('pilotModal');

                if (groupsModal.style.display === 'block') closeModal('groupsModal');
                if (pilotModal.style.display === 'block') closeModal('pilotModal');
            }
        });

        function openModal(id) {
            const modal = document.getElementById(id);
            const iframe = document.getElementById('groups-frame');

            if (id === 'groupsModal' && iframe) {
                // 1. Ustawiamy źródło dopiero teraz
                iframe.src = "/static/groups_view.html";

                // 2. Czekamy, aż iframe się załaduje, zanim wyślemy sygnał odliczania
                iframe.onload = () => {
                    startModalAutoClose(id, 15);
                };
            }
            modal.style.display = 'block';

            // Jeśli otwieramy grupy, ustawiamy autozamykanie

        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            const iframe = document.getElementById('groups-frame');
            modal.style.display = 'none';

            if (id === 'groupsModal' && iframe) {
                iframe.src = "";
            }
            // Czyścimy licznik, jeśli użytkownik zamknął okno ręcznie wcześniej
            if (modalTimer) {
                clearTimeout(modalTimer);
                modalTimer = null;
            }
        }

        function startModalAutoClose(id, seconds) {
            // Czyścimy poprzedni licznik, jeśli istniał
            if (modalTimer) clearTimeout(modalTimer);

            // Ustawiamy zamknięcie po X sekundach
            modalTimer = setTimeout(() => {
                closeModal(id);
            }, seconds * 1000);

            // Opcjonalnie: informujemy iframe, że ma zacząć odliczać wizualnie
            const iframe = document.querySelector(`#${id} iframe`);
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'startCountdown', duration: seconds }, '*');
            }
        }

        async function pilotAction(action) {
            // Tu możesz dodać fetch do Twojego przyszłego API akcji pilota
            console.log("Pilot action executed:", action);
            alert("Zgłoszono: " + action);
            closeModal('pilotModal');
        }

        // Sound playback — guarded by audioEnabled set in startDashboard()
        function playStartSound() {
            if (!audioEnabled) return;
            const audio = document.getElementById('startSound');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(err => console.log('Cannot play start sound:', err));
            }
        }

        function playEndSound() {
            if (!audioEnabled) return;
            const audio = document.getElementById('endSound');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(err => console.log('Cannot play end sound:', err));
            }
        }

        // Polling is started by startDashboard() after user interaction
    </script>
</body>

</html>
