<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WKM Racing Management System</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" href="/static/wkm.ico" type="image/x-icon">
</head>

<body>
    <div class="container">

        <div class="timer-block">
            <span id="timerDisplay"></span>
        </div>
        <div class="phase-block">
            <span id="phaseDisplay">Czekamy na start</span>

        </div>

        <div class="message-block">
            <span id="messageText"></span>
        </div>

        <div class="current-group-block">
            <span class="current-group-text">Bieżąca grupa :</span><span id="currentGroupDisplay"></span>
        </div>

        <div class="pilot-block">
            <span class="pilot-item">
                <span class="pilot-name" id="pilotR1">Pilot1 </span>
                <span class="pilot-channel" id="pilotR1channel">R1</span>
            </span>
            <span class="pilot-item">
                <span class="pilot-name" id="pilotR3">Pilot2 </span>
                <span class="pilot-channel" id="pilotR3channel">R3</span>
            </span>
            <span class="pilot-item">
                <span class="pilot-name" id="pilotR6">Pilot3 </span>
                <span class="pilot-channel" id="pilotR6channel">R6</span>
            </span>
            <span class="pilot-item">
                <span class="pilot-name" id="pilotR7">Pilot4 </span>
                <span class="pilot-channel" id="pilotR7channel">R7</span>
            </span>
        </div>


        <div class="next-pilot-block">
            <div class="next-pilot-message">
                <span id="nextpilotmessage">Następna grupa</span>
            </div>
            <div class="next-pilot-item">
                <span class="next-pilot-name" id="nextpilotR1">Next Pilot1 </span>
                <span class="next-pilot-channel" id="nextpilotR1channel">R1</span>
            </div>
            <div class="next-pilot-item">
                <span class="next-pilot-name" id="nextpilotR3">Next Pilot3 </span>
                <span class="next-pilot-channel" id="nextpilotR3channel">R2</span>
            </div>
            <div class="next-pilot-item">
                <span class="next-pilot-name" id="nextpilotR6">Next Pilot4 </span>
                <span class="next-pilot-channel" id="nextpilotR6channel">R6</span>
            </div>
            <div class="next-pilot-item">
                <span class="next-pilot-name" id="nextpilotR7">Next Pilot4 </span>
                <span class="next-pilot-channel" id="nextpilotR7channel">R7</span>
            </div>
        </div>


        <div class="menu-block">
            <button class="menu-button" id="groups-button">Grupy</button>
            <button class="menu-button" id="pilot-button">Pilot</button>
            <button class="menu-button" id="master-button">Master</button>
        </div>
    </div>
</body>
<script src="/static/app.js"></script>

</html>
