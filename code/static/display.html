<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WKM Racing - Wyświetlacz Timera</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #timerCard {
            background-color: #222;
            color: #fff;
            padding: 40px;
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h2 {
            color: #ffc107;
            margin: 10px 0;
            font-size: 2.5em;
        }

        h1 {
            font-size: 10em;
            margin: 20px 0;
            font-family: monospace;
            letter-spacing: 0.1em;
        }

        h3 {
            margin: 10px 0;
            font-size: 2em;
        }

        #pilotsDisplay {
            margin-top: 30px;
            font-size: 1.5em;
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        #currentPilots, #nextPilots {
            text-align: left;
            min-width: 300px;
        }

        #nextPilots {
            opacity: 0.7;
            border-left: 3px solid #ffc107;
            padding-left: 60px;
        }

        #currentPilots div, #nextPilots div {
            margin: 8px 0;
            line-height: 1.4;
        }

        #currentPilots strong, #nextPilots strong {
            font-size: 1.3em;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Audio elements dla dźwięków -->
    <audio id="startSound" preload="auto">
        <source src="/static/sounds/start.mp3" type="audio/mpeg">
    </audio>
    <audio id="endSound" preload="auto">
        <source src="/static/sounds/end.mp3" type="audio/mpeg">
    </audio>

    <div id="timerCard">
        <h2 id="phaseDisplay">Faza: Oczekiwanie</h2>
        <h1 id="timerDisplay">00:00</h1>
        <h3 id="currentGroupDisplay">Grupa: -</h3>
        <div id="pilotsDisplay">
            <div id="currentPilots"></div>
            <div id="nextPilots"></div>
        </div>
    </div>

    <script src="/static/display.js"></script>
</body>
</html>
